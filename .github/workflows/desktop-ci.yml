# PRSLOY Desktop: быстрая проверка на Linux (типы, тесты, сборка) на каждый push и PR в app/.
name: desktop-ci

on:
  push:
    paths: ["app/**", ".github/workflows/desktop-ci.yml"]
  pull_request:
    paths: ["app/**"]

concurrency:
  group: desktop-ci-${{ github.ref }}
  # main: never cancel — a cancelled e2e on main hid the agent-host crash (d6308b4); branches: newest wins
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    working-directory: app

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      # issue #23: live free web search without a key (GitHub, npm, PyPI, endoflife.date, DuckDuckGo, jsDelivr) —
      # informational, the network of CI runners is not ours
      - name: Web search smoke (live, non-blocking)
        continue-on-error: true
        timeout-minutes: 3
        run: node --experimental-strip-types --no-warnings packages/prsloy-harness/scripts/web-smoke.mts
      - run: pnpm test:release-assets
      - run: pnpm build

  # Skills (skills/<name>) through NVIDIA SkillSpector — static (regex, AST, taint, YARA), no LLM — plus the
  # harness's own threat check (packages/prsloy-harness/scripts/skill-scan.mts). Third-party code: own job,
  # read-only token, no secrets, scanner and setup-uv pinned by full commit SHA. Non-blocking until the first
  # scores are known (then the ≤ 50/100 threshold turns blocking).
  skill-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The script comes with harness (desktop/harness-skillspector): until it is on this ref, say so.
      - name: Scan script present
        id: script
        run: |
          if [ -f packages/prsloy-harness/scripts/skill-scan.mts ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::packages/prsloy-harness/scripts/skill-scan.mts нет на $GITHUB_REF_NAME — проверка навыков пропущена"
          fi
      - uses: pnpm/action-setup@v6
        if: steps.script.outputs.present == 'true'
        with:
          version: 11.15.1
      - uses: actions/setup-node@v7
        if: steps.script.outputs.present == 'true'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - if: steps.script.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      # astral-sh/setup-uv v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        if: steps.script.outputs.present == 'true'
      - name: Skill security scan (NVIDIA SkillSpector, static, no LLM)
        if: steps.script.outputs.present == 'true'
        timeout-minutes: 10
        run: |
          uv tool install --python 3.12 "git+https://github.com/NVIDIA/skillspector.git@d7338f58200a9ae2a24810cee08911ab68b107a7"
          node --experimental-strip-types --no-warnings packages/prsloy-harness/scripts/skill-scan.mts --json skill-scan.json
      - name: Summary
        if: always() && steps.script.outputs.present == 'true'
        run: |
          [ -f skill-scan.json ] && { echo "## Skill scan"; echo '```json'; cat skill-scan.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always() && steps.script.outputs.present == 'true'
        with:
          name: skill-scan
          path: app/skill-scan.json
          if-no-files-found: ignore

  # Electron e2e на Linux под xvfb: весь набор e2e/*.spec.ts (кроме дымовых Windows), два шарда по ~4 мин.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm electron:install
      - run: pnpm build:desktop
      # Ubuntu 24.04: AppArmor blocks the unprivileged user namespaces Chromium's sandbox needs
      - name: Allow Electron's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Electron e2e (shard ${{ matrix.shard }}/2)
        working-directory: app/apps/desktop
        env:
          # Pi sessions of every launch, for the nightly session auditor (desktop-audit.yml, #29)
          PRSLOY_E2E_SESSIONS: ${{ runner.temp }}/e2e-sessions
        run: xvfb-run -a npx playwright test --shard=${{ matrix.shard }}/2 --reporter=list --trace=retain-on-failure
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results-${{ matrix.shard }}
          path: app/apps/desktop/test-results/
          if-no-files-found: ignore
          retention-days: 14
      # Synthetic sessions of the fake gateway (no user data); the nightly audit takes the latest from main.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-sessions-${{ matrix.shard }}
          path: ${{ runner.temp }}/e2e-sessions
          if-no-files-found: ignore
          retention-days: 7

  # Layout lint (e2e-audit/layout-lint.spec.ts): key screens × window sizes × scales, one theme per
  # job. Red on any violation that layout-baseline.json does not excuse; the table is in the summary.
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        theme: [light, dark]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm electron:install
      - run: pnpm build:desktop
      - name: Allow Electron's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Layout rules on fixture pages
        working-directory: app/apps/desktop
        run: xvfb-run -a npx playwright test -c playwright.audit.config.ts layout-rules --reporter=list
      - name: Layout lint (${{ matrix.theme }})
        working-directory: app/apps/desktop
        env:
          LAYOUT_OUT: ${{ github.workspace }}/app/layout-out
          LAYOUT_THEMES: ${{ matrix.theme }}
        # 2560×1440 windows need a screen at least that big
        run: xvfb-run -a -s "-screen 0 2600x1500x24" npx playwright test -c playwright.audit.config.ts layout-lint --reporter=list
      - name: Report
        if: always()
        run: |
          [ -d layout-out ] || exit 0
          node --experimental-strip-types --no-warnings apps/desktop/e2e-audit/layout-report.ts layout-out > /dev/null
          cat layout-out/layout-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layout-lint-${{ matrix.theme }}
          path: app/layout-out
          if-no-files-found: ignore
          retention-days: 14
