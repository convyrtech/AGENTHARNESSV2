# PRSLOY Desktop (app/, форк Zeno): установщик Windows на каждый push в app/ и релиз по тегу desktop-v*.
# Push в main → артефакт prsloy-win-x64 (exe + latest.yml) на 14 дней.
# Тег desktop-v0.1.0-alpha.1 → GitHub Release с exe + latest.yml (фид автообновления electron-updater).
name: desktop-windows

on:
  push:
    branches: [main, desktop/ci]
    paths: ["app/**", ".github/workflows/desktop-windows.yml"]
    tags: ["desktop-v*"]
  workflow_dispatch:

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/../.cache/electron-builder
      ELECTRON_CACHE: ${{ github.workspace }}/../.cache/electron
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Version from tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#desktop-v}"
          node -e "const f='./apps/desktop/package.json';const p=require(f);p.version='${VERSION}';require('fs').writeFileSync(f,JSON.stringify(p,null,2)+'\n')"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Electron binary
        run: pnpm electron:install
      - name: Package (unsigned unless CSC secrets are set)
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${CSC_LINK:-}" || -z "${CSC_KEY_PASSWORD:-}" ]]; then
            unset CSC_LINK CSC_KEY_PASSWORD || true
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          pnpm package
      - name: Collect
        shell: bash
        run: node scripts/release-assets.mjs collect apps/desktop/release/app artifacts --platform win --arch "${{ runner.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: prsloy-win-x64
          path: app/artifacts/*
          if-no-files-found: error
          retention-days: 14

  # Installs the built exe silently on a fresh runner, launches the installed PRSLOY.exe with a
  # fake model and checks window → runtime extraction → Agent Host → reply → bash tool call.
  smoke:
    needs: package
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install test deps
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: prsloy-win-x64
          path: app/installer
      - name: Silent install (per-user)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force smoke-out | Out-Null
          $setup = Get-ChildItem installer -Filter 'PRSLOY-*-win-x64.exe' | Select-Object -First 1
          if (-not $setup) { throw 'installer exe not found' }
          $sizeMb = [math]::Round($setup.Length / 1MB, 1)
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process $setup.FullName -ArgumentList '/S','/currentuser' -Wait -PassThru
          $sw.Stop()
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\PRSLOY\PRSLOY.exe'
          if (-not (Test-Path $exe)) {
            $hit = Get-ChildItem $env:LOCALAPPDATA, $env:ProgramFiles -Filter PRSLOY.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $hit) { throw 'PRSLOY.exe not found after install' }
            $exe = $hit.FullName
          }
          $installMb = [math]::Round(((Get-ChildItem (Split-Path $exe) -Recurse -File | Measure-Object Length -Sum).Sum) / 1MB, 1)
          "PRSLOY_EXE=$exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          @{ installer = $setup.Name; installerMb = $sizeMb; installSeconds = [math]::Round($sw.Elapsed.TotalSeconds, 1); installedMb = $installMb; exe = $exe } |
            ConvertTo-Json | Out-File -Encoding utf8 smoke-out/install.json
          Get-Content smoke-out/install.json
      # Evidence for the clean-Windows bash fix: fetch MinGit (Git for Windows, minimal) and
      # let the smoke test try it as Pi's bash with system Git hidden. Report-only.
      - name: Fetch MinGit / PortableGit (fix candidates)
        continue-on-error: true
        shell: pwsh
        env:
          GH_API_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $rel = Invoke-RestMethod -Headers @{ Authorization = "Bearer $env:GH_API_TOKEN" } https://api.github.com/repos/git-for-windows/git/releases/latest
          $info = @{ tag = $rel.tag_name }
          $patterns = @{
            'MinGit' = '^MinGit-[\d.]+-64-bit\.zip$'
            'MinGit-busybox' = '^MinGit-[\d.]+-busybox-64-bit\.zip$'
            'PortableGit' = '^PortableGit-[\d.]+-64-bit\.7z\.exe$'
          }
          foreach ($kind in $patterns.Keys) {
            $asset = $rel.assets | Where-Object { $_.name -match $patterns[$kind] } | Select-Object -First 1
            if (-not $asset) { continue }
            $file = Join-Path $env:RUNNER_TEMP $asset.name
            Invoke-WebRequest $asset.browser_download_url -OutFile $file
            $dir = Join-Path $env:RUNNER_TEMP $kind
            if ($kind -eq 'PortableGit') {
              # 7-Zip self-extractor: -o<dir> -y, no installer UI.
              Start-Process $file -ArgumentList "-o`"$dir`"", '-y' -Wait -NoNewWindow
            } else {
              Expand-Archive $file $dir -Force
            }
            $files = Get-ChildItem $dir -Recurse -File
            $info[$kind] = @{
              asset = $asset.name
              zipMb = [math]::Round($asset.size / 1MB, 1)
              unpackedMb = [math]::Round((($files | Measure-Object Length -Sum).Sum) / 1MB, 1)
              files = $files.Count
              bashExe = @($files | Where-Object Name -eq 'bash.exe' | ForEach-Object { $_.FullName.Substring($dir.Length + 1) })
              shExe = @($files | Where-Object Name -in 'sh.exe','busybox.exe' | ForEach-Object { $_.FullName.Substring($dir.Length + 1) })
            }
          }
          $info | ConvertTo-Json -Depth 4 | Out-File -Encoding utf8 smoke-out/mingit.json
          Get-Content smoke-out/mingit.json
          if ($info['MinGit']) { "SMOKE_MINGIT_DIR=$(Join-Path $env:RUNNER_TEMP 'MinGit')" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV }
          if ($info['PortableGit']) { "SMOKE_PORTABLEGIT_DIR=$(Join-Path $env:RUNNER_TEMP 'PortableGit')" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV }
      - name: Smoke test (installed app)
        working-directory: app/apps/desktop
        env:
          SMOKE_OUT: ${{ github.workspace }}/app/smoke-out
        run: pnpm exec playwright test -c playwright.smoke.config.ts
      - name: Collect app logs
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem $env:TEMP -Directory -Filter 'prsloy-smoke-*' -ErrorAction SilentlyContinue | ForEach-Object {
            $dest = Join-Path smoke-out "userData-$($_.Name)"
            robocopy (Join-Path $_.FullName 'userData') $dest /E /XD runtimes npm-prefix python-venv Cache 'Code Cache' GPUCache DawnCache /NFL /NDL /NJH /NJS | Out-Null
          }
          $global:LASTEXITCODE = 0
      - name: Summary
        if: always()
        shell: pwsh
        run: |
          "## Smoke" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          foreach ($f in 'install.json','metrics.json','bash-runner.json','bash-clean.json','clean-env.json','mingit.json','bash-mingit.json','bash-portablegit.json') {
            $path = Join-Path smoke-out $f
            if (Test-Path $path) { "### $f", '```json', (Get-Content $path -Raw), '```' | Out-File -Append $env:GITHUB_STEP_SUMMARY }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prsloy-win-smoke
          path: app/smoke-out
          retention-days: 14

  release:
    needs: [package, smoke]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: prsloy-win-x64
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: PRSLOY ${{ github.ref_name }}
          prerelease: true
          fail_on_unmatched_files: true
          files: release-assets/*
