# PRSLOY Desktop (app/, форк Zeno): установщик Windows на каждый push в app/ и релиз.
# Push в main → артефакт prsloy-win-x64 (exe + latest.yml) на 14 дней.
# Выпуск (app/docs/prsloy/RELEASE-HOWTO.md): Run workflow на main с version=0.1.0-alpha.2 →
# сборка → smoke (обе Windows) → update-e2e → тег v<version> и сразу опубликованный пре-релиз
# со всеми файлами. Упало что-то — не публикуется ничего. С другой ветки или с dry_run — тот же путь
# до release-job включительно (файлы скачаны и сверены с latest.yml), без тега и релиза.
# Старые пути: push тега v* (релиз создаёт этот прогон) и release: published из UI (файлы
# прикрепляет этот прогон; если он упал, релиз уходит в draft, чтобы не блокировать обновления).
# Тег и релиз, созданные здесь от GITHUB_TOKEN, новых прогонов не запускают (GitHub: события
# GITHUB_TOKEN, кроме workflow_dispatch и repository_dispatch, не создают workflow run).
name: desktop-windows

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/desktop-windows.yml"]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Версия выпуска, например 0.1.0-alpha.2 (пусто — только сборка и проверки)"
        required: false
        type: string
      dry_run:
        description: "Сухой прогон: весь путь до выпуска, без тега и релиза"
        required: false
        type: boolean
        default: false

concurrency:
  # event_name: a UI release fires both «push tag» and «release published» on one ref; neither may
  # cancel the other.
  group: desktop-windows-${{ github.event_name }}-${{ github.ref }}
  # main: never cancel — a cancelled e2e on main hid the agent-host crash (d6308b4); branches: newest wins
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  # What this run is: ci (build + tests), dispatch-dry, dispatch-release, tag-release, ui-release
  # or skip (a tag pushed by a UI release: the release:published run handles it).
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          semver='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          exists() { gh api "repos/$GITHUB_REPOSITORY/$1" --silent 2>/dev/null; }
          mode=ci version= tag=
          # dry_run checks the release path for a version; without one it would quietly be a plain ci run.
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$INPUT_DRY_RUN" == true && -z "$INPUT_VERSION" ]]; then
            echo "::error::для сухого прогона нужна версия (version, например 0.1.0-alpha.2): без неё release-job не запускается"
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && -n "$INPUT_VERSION" ]]; then
            version="${INPUT_VERSION#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta)\.[0-9]+$ ]]; then
              echo "::error::version «$INPUT_VERSION»: нужен semver-prerelease вида 0.1.0-alpha.2"
              exit 1
            fi
            tag="v$version"
            if exists "git/ref/tags/$tag" || exists "releases/tags/$tag"; then
              echo "::error::тег или релиз $tag уже есть — возьмите следующую версию"
              exit 1
            fi
            if [[ "$GITHUB_REF" == refs/heads/main && "$INPUT_DRY_RUN" != true ]]; then
              mode=dispatch-release
            else
              mode=dispatch-dry
            fi
          elif [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tag="$GITHUB_REF_NAME"
            version="${tag#v}"
            if [[ "$tag" != v* || ! "$version" =~ $semver ]]; then
              echo "::error::тег $tag не semver с «v» — electron-updater его не увидит"
              exit 1
            fi
            if [[ "$GITHUB_EVENT_NAME" == release ]]; then
              mode=ui-release
              msg="Релиз $tag создан без файлов. Обновления у пользователей не работают, пока этот прогон не прикрепит файлы. Если прогон упадёт, релиз уйдёт в draft. Дальше — только кнопкой (RELEASE-HOWTO.md)."
              echo "::warning::$msg"
              printf '> [!WARNING]\n> %s\n\n' "$msg" >> "$GITHUB_STEP_SUMMARY"
            elif exists "releases/tags/$tag"; then
              mode=skip
              echo "Релиз $tag уже есть (создан в UI) — файлы прикрепляет прогон release: published." >> "$GITHUB_STEP_SUMMARY"
            else
              mode=tag-release
            fi
          fi
          publish=false
          [[ "$mode" == dispatch-release || "$mode" == tag-release || "$mode" == ui-release ]] && publish=true
          echo "**mode** $mode · **version** ${version:-(package.json)} · **tag** ${tag:--} · **publish** $publish" >> "$GITHUB_STEP_SUMMARY"
          { echo "mode=$mode"; echo "version=$version"; echo "tag=$tag"; echo "publish=$publish"; } >> "$GITHUB_OUTPUT"

  package:
    needs: plan
    if: needs.plan.outputs.mode != 'skip'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/../.cache/electron-builder
      ELECTRON_CACHE: ${{ github.workspace }}/../.cache/electron
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Version
        if: needs.plan.outputs.version != ''
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          node -e "const f='./apps/desktop/package.json';const p=require(f);p.version=process.env.VERSION;require('fs').writeFileSync(f,JSON.stringify(p,null,2)+'\n')"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Electron binary
        run: pnpm electron:install
      - name: Package (unsigned unless CSC secrets are set)
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${CSC_LINK:-}" || -z "${CSC_KEY_PASSWORD:-}" ]]; then
            unset CSC_LINK CSC_KEY_PASSWORD || true
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          pnpm package
      - name: Collect
        shell: bash
        run: node scripts/release-assets.mjs collect apps/desktop/release/app artifacts --platform win --arch "${{ runner.arch }}"
      # latest.yml as GitHubProvider reads it: url = asset name GitHub keeps, size, sha512, blockmap.
      - name: Check latest.yml
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: node scripts/release-assets.mjs check-feed artifacts ${VERSION:+--version "$VERSION"}
      # What the installer is made of and what could go (measure only, never blocks packaging).
      - name: Installer composition
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          setup=$(ls apps/desktop/release/app/PRSLOY-*-win-x64.exe | head -1)
          node apps/desktop/scripts/installer-composition.mjs apps/desktop/release/app/win-unpacked "$setup" composition
          cat composition/composition.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prsloy-win-composition
          path: app/composition
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: prsloy-win-x64
          path: app/artifacts/*
          if-no-files-found: error
          retention-days: 14

  # Installs the built exe silently on a fresh runner, launches the installed PRSLOY.exe with a
  # fake model and checks window → runtime extraction → Agent Host → reply → bash tool call.
  smoke:
    needs: package
    # windows-2022 is the closest image to the Windows 10 many casual users still run.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # A Russian user «Иван Петров» with a project folder that has Cyrillic and a space.
      SMOKE_CYRILLIC_PROFILE: 'C:\Users\Иван Петров'
      SMOKE_CYRILLIC_WORKSPACE: 'C:\Проекты\мой сайт'
      # Strict checks for every spec step (main, Cyrillic profile): fixed bugs must stay fixed.
      SMOKE_STRICT_CLEAN_BASH: "1"
      SMOKE_STRICT_RU: "1"
      SMOKE_STRICT_PYTHON_HTTP: "1"
      # Double-click install: one progress bar, Russian, no wizard page, app starts by itself.
      SMOKE_STRICT_ONECLICK: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install test deps
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: prsloy-win-x64
          path: app/installer
      # First, on the clean runner: the installer as a double click (no /S), screenshots every
      # 0.5 s, window texts checked for wizard pages; then the uninstaller the same way.
      - name: One-click install and uninstall (as a double click)
        shell: pwsh
        env:
          # The installer starts the app itself (inherits this env) in product mode with real network:
          # it found the newer published alpha and installed it on exit, while the uninstaller ran (#32).
          # Update checks are tested in firstrun.spec (dead proxy) and in the update-e2e job, not here.
          PRSLOY_NO_UPDATE: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force smoke-out | Out-Null
          $setup = Get-ChildItem installer -Filter 'PRSLOY-*-win-x64.exe' | Select-Object -First 1
          & ./apps/desktop/e2e-smoke/oneclick-install.ps1 -Installer $setup.FullName -OutDir smoke-out -Strict:($env:SMOKE_STRICT_ONECLICK -eq '1')
      - name: Silent install (per-user)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force smoke-out | Out-Null
          $setup = Get-ChildItem installer -Filter 'PRSLOY-*-win-x64.exe' | Select-Object -First 1
          if (-not $setup) { throw 'installer exe not found' }
          $sizeMb = [math]::Round($setup.Length / 1MB, 1)
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process $setup.FullName -ArgumentList '/S','/currentuser' -Wait -PassThru
          $sw.Stop()
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\PRSLOY\PRSLOY.exe'
          if (-not (Test-Path $exe)) {
            $hit = Get-ChildItem $env:LOCALAPPDATA, $env:ProgramFiles -Filter PRSLOY.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $hit) { throw 'PRSLOY.exe not found after install' }
            $exe = $hit.FullName
          }
          $installMb = [math]::Round(((Get-ChildItem (Split-Path $exe) -Recurse -File | Measure-Object Length -Sum).Sum) / 1MB, 1)
          "PRSLOY_EXE=$exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          @{ installer = $setup.Name; installerMb = $sizeMb; installSeconds = [math]::Round($sw.Elapsed.TotalSeconds, 1); installedMb = $installMb; exe = $exe } |
            ConvertTo-Json | Out-File -Encoding utf8 smoke-out/install.json
          Get-Content smoke-out/install.json
      - name: Smoke test (installed app)
        working-directory: app/apps/desktop
        env:
          SMOKE_OUT: ${{ github.workspace }}/app/smoke-out
          # Clean-machine bash (system Git hidden) must work via the bundled PortableGit.
          SMOKE_REPORT: main
        # smoke: test-mode launches (runner + clean Windows); firstrun: product mode (key gate,
        # PRSLOY provider, update check behind a dead proxy).
        run: pnpm exec playwright test -c playwright.smoke.config.ts smoke.spec.ts firstrun.spec.ts harness.spec.ts
      # Reinstall into the Cyrillic profile (NSIS replaces the first install) and run the app from there.
      - name: Silent install into a Cyrillic profile
        if: success() || failure()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem installer -Filter 'PRSLOY-*-win-x64.exe' | Select-Object -First 1
          $target = Join-Path $env:SMOKE_CYRILLIC_PROFILE 'AppData\Local\Programs\PRSLOY'
          New-Item -ItemType Directory -Force $env:SMOKE_CYRILLIC_PROFILE, $env:SMOKE_CYRILLIC_WORKSPACE | Out-Null
          $sw = [Diagnostics.Stopwatch]::StartNew()
          # NSIS: /D= must be last and unquoted, even with spaces.
          $p = Start-Process $setup.FullName -ArgumentList "/S /currentuser /D=$target" -Wait -PassThru
          $sw.Stop()
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          $exe = Join-Path $target 'PRSLOY.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "PRSLOY.exe not found in $target" }
          "PRSLOY_EXE_CYRILLIC=$exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          @{ exe = $exe; installSeconds = [math]::Round($sw.Elapsed.TotalSeconds, 1) } |
            ConvertTo-Json | Out-File -Encoding utf8 smoke-out/install-cyrillic.json
          Get-Content smoke-out/install-cyrillic.json
      # Evidence for the runtime extraction under Cyrillic paths: the same System32\tar.exe call
      # the app makes, per path variant, plus the system codepages (runner: 1252, Russian Windows: 1251).
      - name: Probe tar with Cyrillic paths
        if: (success() || failure()) && env.PRSLOY_EXE_CYRILLIC != ''
        continue-on-error: true
        shell: pwsh
        run: |
          $nls = Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Nls\CodePage'
          @{ ACP = $nls.ACP; OEMCP = $nls.OEMCP; systemLocale = (Get-WinSystemLocale).Name } |
            ConvertTo-Json | Out-File -Encoding utf8 smoke-out/codepage.json
          Get-Content smoke-out/codepage.json
          $archive = Join-Path (Split-Path $env:PRSLOY_EXE_CYRILLIC) 'resources\runtimes\archives\node.tar.gz'
          node apps/desktop/e2e-smoke/tar-probe.mjs $archive (Join-Path $env:SMOKE_CYRILLIC_PROFILE 'tar probe') (Join-Path $env:RUNNER_TEMP 'tarprobe') smoke-out/tar-probe.json
      - name: Smoke test (Cyrillic profile)
        if: (success() || failure()) && env.PRSLOY_EXE_CYRILLIC != ''
        working-directory: app/apps/desktop
        env:
          SMOKE_OUT: ${{ github.workspace }}/app/smoke-out
          SMOKE_REPORT: cyrillic
          PRSLOY_EXE: ${{ env.PRSLOY_EXE_CYRILLIC }}
        run: pnpm exec playwright test -c playwright.smoke.config.ts cyrillic.spec.ts
      - name: Collect app logs
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem $env:TEMP -Directory -Filter 'prsloy-smoke-*' -ErrorAction SilentlyContinue | ForEach-Object {
            $dest = Join-Path smoke-out "userData-$($_.Name)"
            robocopy (Join-Path $_.FullName 'userData') $dest /E /XD runtimes npm-prefix python-venv Cache 'Code Cache' GPUCache DawnCache /NFL /NDL /NJH /NJS | Out-Null
          }
          $cyr = Join-Path $env:SMOKE_CYRILLIC_PROFILE 'AppData\Roaming\PRSLOY'
          if (Test-Path -LiteralPath $cyr) {
            robocopy $cyr (Join-Path smoke-out 'userData-cyrillic') /E /XD runtimes npm-prefix python-venv Cache 'Code Cache' GPUCache DawnCache /NFL /NDL /NJH /NJS | Out-Null
          }
          if (Test-Path -LiteralPath $env:SMOKE_CYRILLIC_WORKSPACE) {
            Get-ChildItem -LiteralPath $env:SMOKE_CYRILLIC_WORKSPACE -Force | Select-Object Name, Length |
              ConvertTo-Json | Out-File -Encoding utf8 smoke-out/cyrillic-workspace.json
          }
          $global:LASTEXITCODE = 0
      - name: Summary
        if: always()
        shell: pwsh
        run: |
          "## Smoke (${{ matrix.os }})" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          foreach ($f in 'oneclick.json','install.json','install-cyrillic.json','metrics.json','bash-runner.json','bash-clean.json','bash-cyrillic.json','clean-env.json','codepage.json','tar-probe.json') {
            $path = Join-Path smoke-out $f
            if (Test-Path $path) { "### $f", '```json', (Get-Content $path -Raw), '```' | Out-File -Append $env:GITHUB_STEP_SUMMARY }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prsloy-win-smoke-${{ matrix.os }}
          path: app/smoke-out
          retention-days: 14

  # Auto-update end to end: build A and a newer B like the tag build, install A, and serve the
  # releases from a local GitHub look-alike (releases.atom + 302 to an objects host) that the real
  # GitHubProvider reaches through a test-only loopback host (auto-update.ts resolveUpdateFeed).
  # Tampered B is refused, a good B installs and relaunches, a newer tag without assets fails
  # quietly, a non-semver tag is skipped. Last: the newest public GitHub release updates to B and
  # keeps the key, the project, the chats and the memory in %APPDATA%\PRSLOY.
  update-e2e:
    needs: plan
    if: needs.plan.outputs.mode != 'skip'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/../.cache/electron-builder
      ELECTRON_CACHE: ${{ github.workspace }}/../.cache/electron
      UPDATE_VERSION_A: 0.1.0-alpha.90
      UPDATE_VERSION_B: 0.1.0-alpha.91
      # «Обновление готово — перезапустить» must install B silently (no NSIS wizard) and relaunch it.
      SMOKE_STRICT_UPDATE_SILENT: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Electron binary
        run: pnpm electron:install
      - name: Build A and B (same path as the tag build)
        shell: bash
        run: |
          set -euo pipefail
          export CSC_IDENTITY_AUTO_DISCOVERY=false
          for VERSION in "$UPDATE_VERSION_A" "$UPDATE_VERSION_B"; do
            node -e "const f='./apps/desktop/package.json';const p=require(f);p.version='${VERSION}';require('fs').writeFileSync(f,JSON.stringify(p,null,2)+'\n')"
            rm -rf apps/desktop/release/app
            start=$(date +%s)
            pnpm package
            echo "built ${VERSION} in $(( $(date +%s) - start )) s"
            node scripts/release-assets.mjs collect apps/desktop/release/app "${RUNNER_TEMP}/upd/${VERSION}" --platform win --arch X64
            ls -la "${RUNNER_TEMP}/upd/${VERSION}"
          done
      - name: Feeds (good, tampered) and install A
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force smoke-out | Out-Null
          $a = Join-Path $env:RUNNER_TEMP "upd\$env:UPDATE_VERSION_A"
          $b = Join-Path $env:RUNNER_TEMP "upd\$env:UPDATE_VERSION_B"
          $good = Join-Path $env:RUNNER_TEMP 'feed-good'
          $bad = Join-Path $env:RUNNER_TEMP 'feed-bad'
          New-Item -ItemType Directory -Force $good, $bad | Out-Null
          # B's feed + A's blockmap (electron-updater diffs the old and new blockmaps).
          Copy-Item "$b\*" $good
          Copy-Item "$a\*.blockmap" $good
          Copy-Item "$good\*" $bad
          # Tampered B: same size, latest.yml unchanged. One byte flipped every 1 MB, so the blocks a
          # differential download fetches are corrupt too (the rest comes from A's cached installer).
          $exeBad = Get-ChildItem $bad -Filter '*.exe' | Select-Object -First 1
          $bytes = [IO.File]::ReadAllBytes($exeBad.FullName)
          for ($i = 4096; $i -lt $bytes.Length; $i += 1MB) { $bytes[$i] = $bytes[$i] -bxor 0xFF }
          [IO.File]::WriteAllBytes($exeBad.FullName, $bytes)
          Copy-Item "$b\latest.yml" smoke-out/latest-B.yml
          Get-ChildItem $a, $b | Select-Object Name, Length | Format-Table | Out-String | Write-Host
          $setup = Get-ChildItem $a -Filter 'PRSLOY-*-win-x64.exe' | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList '/S','/currentuser' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\PRSLOY\PRSLOY.exe'
          if (-not (Test-Path $exe)) { throw 'PRSLOY.exe not found after install' }
          "PRSLOY_EXE=$exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "UPDATE_INSTALLER_A=$($setup.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "UPDATE_RELEASE_A=$a" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "UPDATE_FEED_GOOD=$good" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "UPDATE_FEED_BAD=$bad" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      # What users have installed: the newest published release with update files. The last
      # update test installs it, uses it (key, project, chat, memory) and updates it to B.
      - name: Previous public release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=30" | ConvertFrom-Json
          $pub = $releases | Where-Object {
            -not $_.draft -and $_.tag_name -match '^v\d+\.\d+\.\d+-(alpha|beta)\.\d+$' -and
            ($_.assets.name -contains 'latest.yml') -and ($_.assets.name -match '-win-x64\.exe$')
          } | Sort-Object { [datetime]$_.published_at } -Descending | Select-Object -First 1
          if (-not $pub) { throw 'no published release with latest.yml and a Windows installer' }
          $version = $pub.tag_name.TrimStart('v')
          $dir = Join-Path $env:RUNNER_TEMP "upd\public-$version"
          New-Item -ItemType Directory -Force $dir | Out-Null
          gh release download $pub.tag_name -R $env:GITHUB_REPOSITORY -D $dir -p 'latest.yml' -p '*-win-x64.exe' -p '*-win-x64.exe.blockmap'
          if ($LASTEXITCODE -ne 0) { throw "gh release download $($pub.tag_name) failed" }
          $setup = Get-ChildItem $dir -Filter '*-win-x64.exe' | Select-Object -First 1
          # B's feed + the public release's blockmap (the base of its differential download).
          $feed = Join-Path $env:RUNNER_TEMP 'feed-public'
          New-Item -ItemType Directory -Force $feed | Out-Null
          Copy-Item (Join-Path $env:RUNNER_TEMP "upd\$env:UPDATE_VERSION_B\*") $feed
          Copy-Item "$dir\*.blockmap" $feed
          Get-ChildItem $dir, $feed | Select-Object Name, Length | Format-Table | Out-String | Write-Host
          "UPDATE_PUBLIC_VERSION=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "UPDATE_PUBLIC_INSTALLER=$($setup.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "UPDATE_RELEASE_PUBLIC=$dir" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "UPDATE_FEED_PUBLIC=$feed" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Update e2e
        working-directory: app/apps/desktop
        env:
          SMOKE_OUT: ${{ github.workspace }}/app/smoke-out
          SMOKE_REPORT: update
        run: pnpm exec playwright test -c playwright.smoke.config.ts update.spec.ts
      - name: Summary
        if: always()
        shell: pwsh
        run: |
          "## Auto-update e2e" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          $path = Join-Path smoke-out 'metrics.json'
          if (Test-Path $path) { '```json', (Get-Content $path -Raw), '```' | Out-File -Append $env:GITHUB_STEP_SUMMARY }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prsloy-win-update-e2e
          path: app/smoke-out
          retention-days: 14

  # Only after package, both smokes and update-e2e passed (implicit success()). A dry run comes
  # this far too and stops before softprops.
  release:
    needs: [plan, package, smoke, update-e2e]
    if: needs.plan.outputs.publish == 'true' || needs.plan.outputs.mode == 'dispatch-dry'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # run_started_at for «N мин от нажатия»
      actions: read
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: app/scripts
      - uses: actions/download-artifact@v4
        with:
          name: prsloy-win-x64
          path: release-assets
      - name: Assets complete
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          ls -la release-assets
          node app/scripts/release-assets.mjs check-feed release-assets --version "$VERSION"
      # Creates the tag at this commit (dispatch) and a published prerelease with all files at once,
      # or attaches the files to the existing release (tag push, UI release).
      - uses: softprops/action-gh-release@v2
        if: needs.plan.outputs.publish == 'true'
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: PRSLOY ${{ needs.plan.outputs.tag }}
          prerelease: true
          draft: false
          fail_on_unmatched_files: true
          files: release-assets/*
      - name: Summary
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          PUBLISH: ${{ needs.plan.outputs.publish }}
        run: |
          started=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at)
          minutes=$(( ($(date +%s) - $(date -d "$started" +%s) + 59) / 60 ))
          if [[ "$PUBLISH" == true ]]; then
            echo "Выпущен [$TAG]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG) за $minutes мин от нажатия." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Сухой прогон $TAG: всё прошло, выпуск остановлен перед публикацией; $minutes мин от нажатия." >> "$GITHUB_STEP_SUMMARY"
          fi

  # Linux (AppImage + deb, desktop-linux.yml) next to the Windows jobs, same version. Nothing
  # Windows waits for it: a red Linux build never holds the Windows release.
  linux:
    needs: plan
    if: needs.plan.outputs.mode != 'skip'
    uses: ./.github/workflows/desktop-linux.yml
    with:
      version: ${{ needs.plan.outputs.version }}

  # After the Windows release job made the release: the Linux files go into the same release, so
  # electron-updater on Linux finds latest-linux.yml next to latest.yml. Until they land, a Linux
  # app skips that release (update-provider.ts) and stays where it is. A dry run only checks.
  release-linux:
    needs: [plan, release, linux]
    if: needs.plan.outputs.publish == 'true' || needs.plan.outputs.mode == 'dispatch-dry'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: app/scripts
      - uses: actions/download-artifact@v4
        with:
          name: prsloy-linux-x64
          path: release-linux
      - name: Linux files complete
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          ls -la release-linux
          node app/scripts/release-assets.mjs check-feed release-linux --platform linux --version "$VERSION"
      - name: Attach to the release
        if: needs.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          gh release upload "$TAG" release-linux/* --clobber -R "$GITHUB_REPOSITORY"
          echo "Linux: AppImage, deb и latest-linux.yml добавлены в $TAG." >> "$GITHUB_STEP_SUMMARY"
      - name: Dry run
        if: needs.plan.outputs.publish != 'true'
        run: |
          echo "Сухой прогон Linux: файлы сверены, в релиз не загружались." >> "$GITHUB_STEP_SUMMARY"

  # A UI release whose run failed: back to draft, so it leaves releases.atom and does not hold
  # everyone's updates (GITHUB_TOKEN with contents: write may edit releases).
  unpublish:
    needs: [plan, package, smoke, update-e2e, release]
    if: always() && github.event_name == 'release' && needs.release.result != 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.event.release.id }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          names=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --jq '.[].name')
          if grep -qx latest.yml <<<"$names"; then
            echo "Релиз $TAG уже с latest.yml — не трогаю." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=true --jq '"draft=\(.draft)"'
          msg="Сборка для $TAG упала: релиз переведён в draft, чтобы не блокировать обновления. Исправьте и выпустите следующую версию кнопкой (RELEASE-HOWTO.md)."
          echo "::error::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
