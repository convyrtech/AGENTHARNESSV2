# «Дизайн» на Windows без приватного design-pipeline (дорожка design):
# Python из комплекта приложения → venv и колёса так же, как при первом заходе во вкладку → Edge через
# Playwright channel=msedge рисует демо движения → check.py на маленьком сайте → «файл инструментов» (zip заглушки
# пайплайна в виде GitHub «Download ZIP») импортируется в userData → run.py init/status/say в папке
# с пробелом и кириллицей на заглушке пайплайна и заглушке pi, без сети. Скрипт: app/apps/desktop/scripts/design-smoke.mts.
# Потом настоящее приложение на этом venv (e2e/design-live.spec.ts): ход на настоящих инструментах с видео в карточке,
# закрытие посреди хода (дерево процессов гаснет), обрыв pi → «Повторить», icacls, шимы python3 в Git Bash.
name: design-windows

on:
  push:
    branches: [main, desktop/design]
    paths:
      - "playbooks/site/**"
      - "app/apps/desktop/src/main/design/**"
      - "app/apps/desktop/scripts/design-smoke.mts"
      - "app/apps/desktop/e2e/design/**"
      - "app/apps/desktop/e2e/design-live.spec.ts"
      - "app/apps/desktop/src/renderer/components/design/**"
      - "app/apps/desktop/src/renderer/lib/design-state.ts"
      - "app/apps/desktop/runtimes/versions.json"
      - ".github/workflows/design-windows.yml"
  workflow_dispatch:

concurrency:
  group: design-windows-${{ github.ref }}
  # main: never cancel — a cancelled e2e on main hid the agent-host crash (d6308b4); branches: newest wins
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  toolchain:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Edge
        shell: pwsh
        run: |
          $edge = Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe", "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $edge) { throw "Microsoft Edge not found" }
          (Get-Item $edge.FullName).VersionInfo.ProductVersion
      - name: Design smoke (Python from the app, venv + wheels, Edge, check.py, tools zip import + run.py in «Иван Петров»)
        shell: pwsh
        working-directory: app/apps/desktop
        env:
          WORK: ${{ runner.temp }}\Иван Петров
          OUT: ${{ runner.temp }}\design-smoke
          PIP_NO_CACHE_DIR: "1"
          PYTHONUTF8: "1"
        run: node --experimental-strip-types scripts/design-smoke.mts --out "$env:OUT" --work "$env:WORK"
      # the real app on the venv the smoke made: real run.py, real tools, Edge; pi is e2e/design/live_pi.py
      - name: Build the app
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm electron:install
          pnpm build:desktop
      - name: Live «Дизайн» e2e (full turn with videos, close mid-turn, stuck → «Повторить», icacls, shims)
        shell: pwsh
        working-directory: app/apps/desktop
        env:
          DESIGN_LIVE_VENV: ${{ runner.temp }}\Иван Петров\AppData\Roaming\PRSLOY\design\venv
          DESIGN_LIVE_SHOTS: ${{ runner.temp }}\design-live-shots
          PYTHONUTF8: "1"
        run: npx playwright test e2e/design-live.spec.ts --reporter=list --trace=retain-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: design-live-windows
          path: |
            ${{ runner.temp }}/design-live-shots/
            app/apps/desktop/test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Summary
        if: always()
        shell: pwsh
        run: |
          $f = "${{ runner.temp }}\design-smoke\design-smoke.json"
          if (Test-Path $f) {
            "### design smoke`n``````json" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            Get-Content $f -Encoding utf8 | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            "``````" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: design-smoke-windows
          path: |
            ${{ runner.temp }}/design-smoke/design-smoke.json
            ${{ runner.temp }}/design-smoke/demo-prsloy.png
            ${{ runner.temp }}/design-smoke/moves-candidates.png
          if-no-files-found: warn
          retention-days: 14

  # The owner's exe: the latest installer desktop-windows built on main (no second build), installed silently per
  # user into a «Иван Петров» folder; the same live spec drives the installed PRSLOY.exe, tools set up by the tab.
  installed:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.15.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Latest installer from main (desktop-windows)
        id: pkg
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # newest main run whose package job left the installer: the run itself may be red on ci's own smoke
          $repo = "${{ github.repository }}"
          $runs = (gh api "repos/$repo/actions/workflows/desktop-windows.yml/runs?branch=main&status=completed&per_page=20" | ConvertFrom-Json).workflow_runs
          $pick = $null
          foreach ($r in $runs) {
            $arts = (gh api "repos/$repo/actions/runs/$($r.id)/artifacts" | ConvertFrom-Json).artifacts
            if ($arts | Where-Object { $_.name -eq 'prsloy-win-x64' -and -not $_.expired }) { $pick = $r; break }
          }
          if (-not $pick) { throw "no desktop-windows installer on main" }
          "run=$($pick.id)" >> $env:GITHUB_OUTPUT
          "sha=$($pick.head_sha)" >> $env:GITHUB_OUTPUT
          "installer: desktop-windows run $($pick.id) at $($pick.head_sha) ($($pick.conclusion))"
      - uses: actions/download-artifact@v4
        with:
          name: prsloy-win-x64
          path: app/pkg
          run-id: ${{ steps.pkg.outputs.run }}
          github-token: ${{ github.token }}
      - name: Test runner
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Silent install (/S /currentuser) into «Иван Петров»
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'Иван Петров\AppData\Local\Programs\PRSLOY'
          $setup = Get-ChildItem app/pkg -Recurse -Filter *.exe | Select-Object -First 1
          "installer: $($setup.Name) ($([math]::Round($setup.Length / 1MB, 1)) MB)"
          $p = Start-Process $setup.FullName -ArgumentList "/S /currentuser /D=$target" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exited with $($p.ExitCode)" }
          $exe = Join-Path $target 'PRSLOY.exe'
          if (-not (Test-Path $exe)) { throw "no $exe after install" }
          "DESIGN_LIVE_EXE=$exe" >> $env:GITHUB_ENV
      - name: Live «Дизайн» on the installed app (wrong zip, no network → retry, first-use setup measured, full turn, close mid-turn, stuck → retry)
        working-directory: app/apps/desktop
        env:
          DESIGN_LIVE_SHOTS: ${{ runner.temp }}\design-live-installed
        run: npx playwright test e2e/design-live.spec.ts --reporter=list --trace=retain-on-failure
      # the owner's first use, measured: time to the tools, the phases he sees, longest still stretch, disk
      - name: First-use summary
        if: always()
        shell: pwsh
        run: |
          $f = "${{ runner.temp }}\design-live-installed\firstuse.json"
          if (Test-Path $f) {
            "### «Дизайн», first use on the installed app`n``````json" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            Get-Content $f -Encoding utf8 | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            "``````" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
            Get-Content $f -Encoding utf8
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: design-live-windows-installed
          path: |
            ${{ runner.temp }}/design-live-installed/
            app/apps/desktop/test-results/
          if-no-files-found: warn
          retention-days: 14
