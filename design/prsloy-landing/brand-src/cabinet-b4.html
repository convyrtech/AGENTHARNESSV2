<style>
@font-face{font-family:Piazzolla;src:url(../../fonts/pz-lat.woff2)format("woff2");font-display:block;unicode-range:U+0000-00FF,U+2000-206F,U+2248}

@font-face{font-family:Geologica;font-weight:300 700;src:url(../../fonts/geo-cyr.woff2)format("woff2");font-display:block;unicode-range:U+0400-045F}
@font-face{font-family:Geologica;font-weight:300 700;src:url(../../fonts/geo-ext.woff2)format("woff2");font-display:block;unicode-range:U+20BD}

@font-face{font-family:"IBM Plex Mono";src:url(../../fonts/mono-cyr.woff2)format("woff2");font-display:block;unicode-range:U+0400-045F}
@font-face{font-family:"IBM Plex Mono";src:url(../../fonts/mono-ext.woff2)format("woff2");font-display:block;unicode-range:U+20BD}
:root{
  --paper:#f3eee3;--card:#faf7f0;--ink:#3b2a1e;--mid:#7a6352;--lo:#b9a894;--faint:#ddd2c1;--accent:#a4472c;--stamp:#b23a26;
  --serif:Piazzolla,Georgia,serif;--sans:Geologica,system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font:400 14px/1.45 var(--sans);font-variant-numeric:tabular-nums;min-height:100vh;overflow-x:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.lo{color:var(--lo)}

.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

.iso.keys-iso[data-theme="light"]{--anatomy-page:#faf7f0;--anatomy-card:#faf7f0;--anatomy-paper:#faf7f0;--anatomy-face:#fdfbf6;--anatomy-top:#fcfaf5;
  --anatomy-shade-0:#e2d8c8;--anatomy-shade-1:#e9e1d3;--anatomy-shade-2:#f0eadf;--anatomy-shade-3:#f6f2ea;--anatomy-lit-top:#c4664a;--anatomy-lit-shade:#a4472c;
  --anatomy-hi:#3b2a1e;--anatomy-mid:#7a6352;--anatomy-lo:#b9a894;--anatomy-faint:#ddd2c1;--anatomy-lit:#a4472c;--anatomy-halo:#7a6352;--anatomy-halo-opacity:.22;
  --anatomy-dot:#3b2a1e;--anatomy-text:#7a6352;--anatomy-strong:#3b2a1e;--anatomy-muted:#7a6352}
.keys-iso{position:relative;width:100%;max-width:440px;margin:0 auto 6px}
.rackp{padding:18px 10px 14px}
.rackp h2{padding:0 8px 10px}
.rack{list-style:none;position:relative;padding:6px 18px;border-left:1.5px solid var(--ink);border-right:1.5px solid var(--ink);
  background:linear-gradient(var(--ink),var(--ink)) 9px 0/1px 100% no-repeat,linear-gradient(var(--ink),var(--ink)) calc(100% - 9px) 0/1px 100% no-repeat}
.rack::before,.rack::after{content:"";position:absolute;top:0;bottom:0;width:6px;background:radial-gradient(circle,var(--lo) 1.4px,transparent 1.6px) 0 4px/6px 14px repeat-y}
.rack::before{left:3px}.rack::after{right:3px}
.unit{position:relative;margin:6px 0;transition:transform .22s cubic-bezier(.33,1,.68,1)}
.unit[aria-current="true"]{transform:translateX(10px)}
.unit[aria-current="true"] .unitbtn{box-shadow:-10px 0 0 -8px var(--ink)}
.unitbtn{display:grid;width:100%;text-align:left;align-items:center;gap:6px 12px;min-height:64px;padding:8px 14px;background:var(--card);border:1.5px solid var(--ink);
  grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"plate drum" "ruler lamp"}
.unitbtn .sc4{position:absolute;width:5px;height:5px;border:1px solid var(--lo);border-radius:50%}
.unitbtn .sc4:nth-child(1){left:4px;top:4px}.unitbtn .sc4:nth-child(2){right:4px;top:4px}.unitbtn .sc4:nth-child(3){left:4px;bottom:4px}.unitbtn .sc4:nth-child(4){right:4px;bottom:4px}
.uplate{grid-area:plate;display:flex;flex-direction:column;gap:2px;min-width:0}
.uname{font:400 19px/1.35 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uprog{font:400 11px/1.3 var(--mono);color:var(--mid);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.udrum{grid-area:drum;display:inline-flex;align-items:flex-end;gap:2px}
.udrum .cell{width:15px;height:26px}
.udrum .strip{font-size:15px;line-height:26px}
.udrum .strip span{height:26px}
.udrum .comma{font-size:16px;padding:0 0 3px}
.udrum .rub{font-size:14px;padding:0 0 5px 3px}
.uruler{grid-area:ruler;display:block;width:100%;min-width:0;max-width:260px;height:auto}
.ulamp{grid-area:lamp;display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mid);justify-self:end;white-space:nowrap;text-overflow:ellipsis}
.uknob{display:none}
.newslot{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:64px;margin:6px 0;border:1.5px dashed var(--mid);color:var(--mid);font-size:14px;background:transparent}
.pult-iso{margin:-6px 0 4px}
@media(min-width:1024px){
  .unitbtn{grid-template-columns:minmax(96px,150px) auto minmax(90px,1fr) minmax(0,150px) 36px;grid-template-areas:"plate drum ruler lamp knob";min-height:72px}
  .ulamp{min-width:0;justify-self:stretch;justify-content:flex-end;text-align:right;white-space:normal;line-height:1.25}
  .ulamp>i{flex:none}
  .uknob{display:block;grid-area:knob;width:36px;height:36px}
}
.keys-iso svg{display:block;width:100%;height:auto}
.dev-ptr{fill:#3b2a1e}
.hit{position:absolute;border:0;background:transparent;border-radius:6px}
.hit[aria-pressed="true"]::after{content:"";position:absolute;left:50%;top:-14px;width:14px;height:10px;margin-left:-7px;background:var(--ink);clip-path:polygon(0 0,100% 0,50% 100%)}
.hit:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.shelf-cap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--mid);margin-top:8px}
.big{font:italic 400 40px/1.2 var(--serif);margin:0 0 6px}
.big b{font-style:normal;font-weight:400}
.big small{font:italic 400 22px/1 var(--serif);color:var(--mid)}
.meta{font-size:13px;color:var(--mid)}
.revoked{margin-top:14px}
.apis{margin-top:14px;border-top:1px solid var(--faint);padding-top:12px;display:grid;gap:4px}
.revoked p{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--mid);min-height:32px}
.revoked s{text-decoration-thickness:1.5px}
/* shell */
.top{display:flex;align-items:center;justify-content:space-between;height:64px;padding:0 16px}
.brand{font:400 23px/1 var(--serif);letter-spacing:.02em;text-decoration:none}
.gw{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--mid)}
.lamp{display:inline-block;width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ink);flex:none}
.lamp[data-l="on"]{background:var(--ink)}
.lamp[data-l="half"]{background:linear-gradient(90deg,var(--ink) 50%,transparent 50%)}
.side{display:none}
.bottom{position:fixed;z-index:30;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1.5px solid var(--ink);padding:4px 4px max(4px,env(safe-area-inset-bottom))}
.bottom a{min-height:48px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--mid);text-decoration:none}
.bottom a[aria-current]{color:var(--ink);box-shadow:inset 0 2px var(--ink)}
main{padding:4px 16px calc(96px + env(safe-area-inset-bottom));max-width:1240px}

/* intro */
.intro{display:grid;gap:12px;margin:8px 0 20px}
h1{font:400 26px/1.15 var(--serif)}
.warn{color:var(--mid);font-size:13px;max-width:46ch}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border:1.5px solid var(--ink);background:var(--card);font-size:14px;text-decoration:none;white-space:nowrap}
.btn.solid{background:var(--ink);color:var(--card)}
.link{display:inline-flex;align-items:center;min-height:44px;text-decoration:underline;text-underline-offset:4px;font-size:14px}
.intro .btn{justify-self:start}

/* plates */
.plate{position:relative;background:var(--card);border:1.5px solid var(--ink);padding:22px 18px 20px}
.plate>.sc{position:absolute;width:7px;height:7px;border:1px solid var(--lo);border-radius:50%}
.plate>.sc::after{content:"";position:absolute;left:1px;right:1px;top:2px;border-top:1px solid var(--lo);transform:rotate(-35deg)}
.plate>.sc:nth-child(1){left:6px;top:6px}.plate>.sc:nth-child(2){right:6px;top:6px}.plate>.sc:nth-child(3){left:6px;bottom:6px}.plate>.sc:nth-child(4){right:6px;bottom:6px}
h2{font:400 22px/1.2 var(--serif)}

/* ledger */
.ledger{padding:16px 0 8px}
.ledger h2{padding:0 18px 10px 46px}
.rows{list-style:none;position:relative}
.rows::before{content:"";position:absolute;left:30px;top:0;bottom:0;border-left:1px solid rgba(164,71,44,.45)}
.row{position:relative;border-top:1px solid var(--faint)}
.row:last-child{border-bottom:1px solid var(--faint)}
.rowbtn{display:grid;width:100%;text-align:left;gap:8px;padding:14px 16px 14px 46px;min-height:44px}
.row[aria-current="true"] .rowbtn{outline:1.5px solid var(--ink);outline-offset:-4px}
.row[aria-current="true"]::before{content:"";position:absolute;left:10px;top:-1px;width:12px;height:30px;background:var(--ink);clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%)}
.r1{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px}
.r1 .lamp{align-self:center}
.name{font:400 19px/1.2 var(--serif)}
.prog{font-size:12px;color:var(--mid)}
.tail{font:400 12px/1.2 var(--mono);color:var(--mid);margin-left:auto}
.wins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.win{border:1px solid var(--ink);padding:4px 6px 5px;min-width:0}
.win b{display:block;font:500 13px/1.25 var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win small{display:block;font-size:10px;color:var(--mid);white-space:nowrap}
.act{font-size:12px;color:var(--mid)}
.row.struck .name,.row.struck .prog,.row.struck .lamp{opacity:.55}
.strike{position:absolute;left:40px;top:26px;width:calc(100% - 160px);height:2px;overflow:visible;pointer-events:none}
.stamp-in{margin-left:auto;font:600 11px/1 var(--mono);letter-spacing:.12em;color:var(--stamp);border:1.5px solid var(--stamp);padding:4px 7px;transform:rotate(-6deg);display:inline-block}
.row.struck .r1 .stamp-in{opacity:1}
.revoked-h{font:400 15px/1.2 var(--serif);color:var(--mid);padding:18px 18px 8px 46px}
.empty{padding:16px 18px 18px 46px;color:var(--mid)}

/* pult */
.pult{display:grid;gap:18px}
.nameplate{justify-self:start;font:500 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--ink);padding:6px 9px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inst{display:grid;gap:18px}
.cap{font-size:13px;color:var(--mid);margin-bottom:6px}
.drum,.limit-drum{display:inline-flex;align-items:flex-end;gap:3px}
.cell{width:30px;height:46px;border:1px solid var(--ink);overflow:hidden;position:relative;background:rgba(255,255,255,.5)}
.cell.small{width:24px;height:38px}
.strip{display:block;font:400 30px/46px var(--mono);text-align:center;will-change:transform}
.cell.small .strip{font-size:24px;line-height:38px}
.strip span{display:block;height:46px}
.cell.small .strip span{height:38px}
.cell[data-dim] .strip{color:var(--lo)}
.comma{font:400 28px/1 var(--mono);padding:0 1px 5px}
.rub{font:400 22px/1 var(--serif);padding:0 0 9px 6px}
.ruler{display:block;width:100%;max-width:340px;height:auto;margin-top:6px;overflow:visible}
.ammeter{display:block;width:100%;max-width:260px;height:auto}
.amm-note{font-size:12px;color:var(--mid);margin-top:4px}
.ctrls{display:grid;gap:22px;border-top:1px solid var(--faint);padding-top:16px}
.galet svg{display:block;width:120px;height:96px;margin:0 auto}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin-top:6px}
.modes button{min-height:44px;font-size:14px;color:var(--mid);border-bottom:1.5px solid transparent}
.modes button[aria-checked="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.mode-note{font-size:13px;color:var(--mid);margin-top:8px}
.limit-row{display:flex;align-items:center;gap:10px;margin-top:4px}
.key{width:44px;height:44px;border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center;font:400 20px/1 var(--mono);background:var(--card);flex:none}
.limit-row .rub{padding:0 4px 7px 2px}
.limit-note{font-size:13px;color:var(--mid);margin-top:8px;max-width:46ch}
.acts{display:grid;gap:2px;border-top:1px solid var(--faint);padding-top:8px}
.cmd{font:400 12px/1.6 var(--mono);background:var(--paper);border:1px solid var(--faint);padding:10px;white-space:pre-wrap;overflow-wrap:anywhere;margin:4px 0 6px}
.confirm{display:grid;gap:10px;border:1.5px solid var(--ink);padding:12px;background:var(--paper)}
.confirm div{display:flex;gap:10px;flex-wrap:wrap}

/* issued */
.issued{display:grid;gap:10px;margin-bottom:16px}
.stamp{position:absolute;right:16px;top:14px;font:600 15px/1 var(--mono);letter-spacing:.12em;color:var(--stamp);border:2px solid var(--stamp);padding:6px 10px;transform:rotate(-8deg);pointer-events:none}
.issued h2{padding-right:110px}
.fullkey{font:500 13px/1.45 var(--mono);word-break:break-all}
.issued p.note{font-size:13px;color:var(--mid)}
.btns{display:flex;gap:10px;flex-wrap:wrap}

/* new key */
.newp{display:grid;gap:14px;margin-bottom:16px}
.field{display:grid;gap:6px}
.field label,.field .lbl{font-size:12px;color:var(--mid)}
.field input{min-height:44px;border:1.5px solid var(--ink);background:#fff;padding:0 12px;width:100%;max-width:340px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-height:44px;padding:0 14px;border:1px solid var(--ink);font-size:13px}
.chips button[aria-checked="true"]{background:var(--ink);color:var(--card)}

/* api */
.api{margin-top:16px;display:grid;gap:6px}
.api-row{max-width:760px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--faint);padding-top:8px;flex-wrap:wrap}
.api-row p{font-size:13px;min-width:0}
.api-row code{font:400 12px/1.4 var(--mono);word-break:break-all}

.workspace{display:grid;gap:16px}

@media(min-width:1024px){
  .top,.bottom{display:none}
  body{display:grid;grid-template-columns:220px minmax(0,1fr)}
  .side{display:block;border-right:1.5px solid var(--ink);min-height:100vh;padding:26px 20px}
  .side .brand{display:block;margin-bottom:12px}
  .side nav{display:grid;gap:4px;margin-top:22px}
  .side nav a{display:flex;align-items:center;min-height:46px;padding:0 14px;color:var(--mid);text-decoration:none;border:1px solid transparent}
  .side nav a[aria-current]{border-color:var(--ink);color:var(--ink);background:var(--card)}
  main{padding:28px 32px 48px}
  .intro{grid-template-columns:1fr auto;align-items:end}
  .intro .btn{grid-column:2;grid-row:1/3;align-self:start}
  .workspace{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);align-items:start}
  #desk-slot{position:sticky;top:16px}
  .pult.plate{padding:26px 26px 22px}
}
@media(max-width:1023px){ .cmd{font-size:11px} .pult-slot{position:relative;z-index:1;background:var(--card)} .pult-slot .plate{border-left:0;border-right:0} }
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  [-40, 0, 40].forEach(a => { const [x1, y1] = P(r + 4, a), [x2, y2] = P(r + 12, a); t += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#3b2a1e" stroke-width="1.5"/>`;
    const [sx, sy] = P(r + 17, a - 13), [ex, ey] = P(r + 17, a + 13); t += `<path d="M${sx} ${sy} A${r + 17} ${r + 17} 0 0 1 ${ex} ${ey}" fill="none" stroke="#ddd2c1" stroke-width="1"/>`; });
  for (let i = 0; i < 24; i++) { const [x1, y1] = P(22, i * 15), [x2, y2] = P(26, i * 15); kn += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#7a6352" stroke-width="1"/>`; }
  return `<svg viewBox="0 0 120 96" aria-hidden="true"><circle cx="${c}" cy="${y}" r="${r}" fill="none" stroke="#3b2a1e" stroke-width="1"/>${t}
    <g class="knob" style="transform-origin:${c}px ${y}px;transform:rotate(${[-40, 0, 40][m]}deg)"><circle cx="${c}" cy="${y}" r="26" fill="#faf7f0" stroke="#3b2a1e" stroke-width="1.5"/>${kn}<circle cx="${c}" cy="${y}" r="18" fill="#faf7f0" stroke="#3b2a1e" stroke-width="1"/><path d="M${c - 4} ${y - 16} L${c + 4} ${y - 16} L${c} ${y - 28} Z" fill="#3b2a1e"/><line x1="${c}" y1="${y - 14}" x2="${c}" y2="${y}" stroke="#3b2a1e" stroke-width="2"/></g></svg>`; }

/* render */
const keyById = id => S.keys.find(k => k.id === id);
function rowHTML(k, struck) { const cur = !struck && S.sel === k.id;
  return `<li class="row${struck ? ' struck' : ''}" data-id="${k.id}" aria-current="${cur}">
  <button class="rowbtn" type="button" ${struck ? 'disabled' : `aria-expanded="${cur}"`}>
    <span class="r1"><i class="lamp" data-l="${struck ? 'off' : k.lamp}" aria-hidden="true"></i><span class="name">${k.name}</span><span class="prog" title="Определяем по адресу запроса">${PROG[k.prog]}</span>${struck ? '<span class="stamp-in">ОТОЗВАН</span>' : `<span class="tail">sk-prs-…${k.tail}</span>`}</span>
    ${struck ? '' : `<span class="wins"><span class="win"><b>${k.req.toLocaleString('ru-RU')}</b><small>запросов</small></span><span class="win"><b>${tok(k.tok)}</b><small>токенов</small></span>${cur ? `<span class="win"><b>${k.limit} ₽</b><small>лимит в день</small></span>` : `<span class="win"><b>${money(k.today)}</b><small>₽ сегодня</small></span>`}</span>
    <span class="act">${k.act}</span>`}</button>
  ${struck ? '<svg class="strike" viewBox="0 0 100 2" preserveAspectRatio="none" aria-hidden="true"><line x1="0" y1="1" x2="100" y2="1" stroke="#3b2a1e" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>' : ''}
  ${cur && !desk() ? '<div class="pult-slot"></div>' : ''}</li>`; }

function pultHTML(k) { const m = k.mode;
  return `<section class="plate pult" aria-label="Пульт ключа ${k.name}">${SC}
  <span class="nameplate">ключ «${k.name}» · ${PROG[k.prog]}${desk() ? ` · sk-prs-…${k.tail}` : ''}</span>
  <div class="inst">
    <div><p class="big"><b>${bigMoney(k.today)}</b> <small>из ${k.limit} ₽ сегодня</small></p><p class="meta">запросов ${k.req.toLocaleString('ru-RU')} · токенов ${tok(k.tok)} · ${k.act}</p><div id="ruler">${rulerSVG(k)}</div><p class="amm-note">красная штриховка: последние 20% лимита</p></div>
    <div><div id="amm">${ammeterSVG(k)}</div><p class="amm-note">за последний час ${money(k.hour)} ₽</p></div>
  </div>
  <div class="ctrls">
    <div class="galet"><div class="cap">Режим ключа</div><div id="galet">${galetSVG(m)}</div>
      <div class="modes" role="radiogroup" aria-label="Режим ключа">${MODES.map((x, i) => `<button type="button" role="radio" aria-checked="${i === m}" data-mode="${i}">${x}</button>`).join('')}</div>
      <p class="mode-note">${MODE_NOTE[m]}</p></div>
    <div><div class="cap">Лимит в день</div>
      <div class="limit-row"><button class="key" type="button" data-lim="-10" aria-label="Уменьшить лимит на 10 ₽">−</button>
        <span class="limit-drum" id="limdrum" aria-hidden="true">${intDrum(k.limit, 3)}</span><span class="rub" aria-hidden="true">₽</span>
        <button class="key" type="button" data-lim="10" aria-label="Увеличить лимит на 10 ₽">+</button></div>
      <span class="sr" aria-live="polite" id="limlive">лимит ${k.limit} ₽ в день</span>
      <p class="limit-note">При ${k.limit} ₽ за день ключ встанет до полуночи по Москве. Баланс не тронется.</p></div>
  </div>
  <div class="acts">
    <button class="link" type="button" data-cmd>Показать команду для ${PROG[k.prog]}</button>
    ${S.cmd ? `<pre class="cmd">${cmdLines(cmdFor(k.prog, 'sk-prs-…' + k.tail))}</pre><p class="amm-note">Ключ в команде скрыт: вставьте свой, его видно один раз при выдаче.</p>` : ''}
    ${S.confirm === k.id ? `<div class="confirm"><p>Программы с этим ключом сразу получат отказ. Отозвать?</p><div><button class="btn solid" type="button" data-revoke-yes>Отозвать</button><button class="btn" type="button" data-revoke-no>Оставить</button></div></div>`
      : `<button class="link" type="button" data-revoke>Отозвать ключ</button>`}
  </div></section>`; }

function issuedHTML() { const i = S.issued, c = cmdFor(i.prog, i.full);
  return `<section class="plate issued" id="issued">${SC}<span class="stamp" data-overlay id="stamp">ВЫДАН</span><h2>Ключ «${i.name}»</h2>
    <p class="fullkey" id="fullkey">${i.full}</p><div class="btns"><button class="btn" type="button" data-copy="${i.full}">Скопировать ключ</button></div>
    <pre class="cmd">${cmdLines(c)}</pre><div class="btns"><button class="btn" type="button" data-copy="${c}">Скопировать команду</button></div>
    <p class="note">Ключ видно один раз. Он уже стоит в команде.</p></section>`; }

let newLim = 50, newProg = 'cc';
function newHTML() { return `<section class="plate newp" id="newp" aria-label="Новый ключ">${SC}<h2>Новый ключ</h2>
  <div class="field"><label for="nn">Как назвать ключ?</label><input id="nn" placeholder="например, работа" maxlength="40"></div>
  <div class="field"><span class="lbl" id="pl">Программа</span><div class="chips" role="radiogroup" aria-labelledby="pl">${Object.entries(PROG).map(([k, v]) => `<button type="button" role="radio" aria-checked="${k === newProg}" data-prog="${k}">${v}</button>`).join('')}</div></div>
  <div class="field"><span class="lbl">Лимит в день</span><div class="limit-row"><button class="key" type="button" data-nlim="-10" aria-label="Уменьшить лимит на 10 ₽">−</button><span class="limit-drum" id="nlim" aria-hidden="true">${intDrum(newLim, 3)}</span><span class="rub" aria-hidden="true">₽</span><button class="key" type="button" data-nlim="10" aria-label="Увеличить лимит на 10 ₽">+</button></div></div>
  <div><button class="btn solid" type="button" id="issue">Выдать ключ</button></div></section>`; }

function unitRuler(k) { const x0 = 4, x1 = 256, L = x1 - x0, p = Math.min(k.today / k.limit, 1); let t = '', h = '';
  for (let i = 0; i <= 20; i++) { const x = x0 + L * i / 20, hh = i % 10 === 0 ? 8 : i % 5 === 0 ? 6 : 3; t += `<line x1="${x.toFixed(1)}" y1="14" x2="${x.toFixed(1)}" y2="${14 - hh}" stroke="${i % 10 === 0 ? '#3b2a1e' : '#7a6352'}" stroke-width="1"/>`; }
  for (let x = x0 + L * .8; x < x1 - 1; x += 5) h += `<line x1="${x.toFixed(1)}" y1="14" x2="${Math.min(x + 5, x1).toFixed(1)}" y2="9" stroke="#a4472c" stroke-width="1"/>`;
  return `<svg class="uruler" viewBox="0 0 260 26" aria-hidden="true"><line x1="${x0}" y1="14" x2="${x1}" y2="14" stroke="#3b2a1e" stroke-width="1.2"/>${h}${t}<path d="M${(x0 + L * p - 4).toFixed(1)} 24 L${(x0 + L * p + 4).toFixed(1)} 24 L${(x0 + L * p).toFixed(1)} 16 Z" fill="#3b2a1e"/></svg>`; }
function unitKnob(m) { const a = [-40, 0, 40][m] * Math.PI / 180;
  return `<svg class="uknob" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="20" r="11" fill="#faf7f0" stroke="#3b2a1e" stroke-width="1.2"/><circle cx="18" cy="20" r="7" fill="none" stroke="#b9a894"/><line x1="18" y1="20" x2="${(18 + 10 * Math.sin(a)).toFixed(1)}" y2="${(20 - 10 * Math.cos(a)).toFixed(1)}" stroke="#3b2a1e" stroke-width="1.6"/>${[-40, 0, 40].map(d => { const r = d * Math.PI / 180; return `<line x1="${(18 + 13 * Math.sin(r)).toFixed(1)}" y1="${(20 - 13 * Math.cos(r)).toFixed(1)}" x2="${(18 + 16 * Math.sin(r)).toFixed(1)}" y2="${(20 - 16 * Math.cos(r)).toFixed(1)}" stroke="#7a6352"/>`; }).join('')}</svg>`; }
function unitHTML(k) { const cur = S.sel === k.id;
  return `<li class="unit" data-id="${k.id}" aria-current="${cur}"><button class="unitbtn" type="button" data-unit="${k.id}" aria-expanded="${cur}" aria-label="Ключ «${k.name}», сегодня ${k.today.toFixed(3).replace('.', ',')} из ${k.limit} ₽, ${k.act}">
    <i class="sc4"></i><i class="sc4"></i><i class="sc4"></i><i class="sc4"></i>
    <span class="uplate"><span class="uname">${k.name}</span><span class="uprog">${PROG[k.prog]} · sk-prs-…${k.tail}</span></span>
    <span class="udrum" aria-hidden="true">${drumHTML(k.today, 4)}</span>
    ${unitRuler(k)}
    <span class="ulamp"><i class="lamp" data-l="${k.lamp}" aria-hidden="true"></i>${k.act}</span>
    ${unitKnob(k.mode)}</button>${cur && !desk() ? '<div class="pult-slot"></div>' : ''}</li>`; }
function renderRack() {
  $('#rackp').innerHTML = SC + '<h2>Ключи</h2><ol class="rack">' + S.keys.map(unitHTML).join('') + '</ol>'
    + '<button class="newslot" type="button" data-hit="new">Свободное место в стойке · Новый ключ</button>'
    + `<div class="apis"><p class="cap">Адрес для своей программы</p><div class="api-row"><p>OpenAI-формат: <code>https://api.prsloy.online/v1</code></p><button class="btn" type="button" data-copy="https://api.prsloy.online/v1">Скопировать</button></div><div class="api-row"><p>Anthropic-формат: <code>https://api.prsloy.online</code></p><button class="btn" type="button" data-copy="https://api.prsloy.online">Скопировать</button></div><a class="link" href="#">Модели и цены</a></div>`
    + (S.revoked.length ? `<div class="revoked"><p class="cap">Отозванные</p>${S.revoked.map(k => `<p><s>${k.name}</s> ${PROG[k.prog]} <span class="stamp-in">ОТОЗВАН</span></p>`).join('')}</div>` : '');
}
function isoOf(k) { const sh = shelf([{id: k.id, name: k.name, prog: PROG[k.prog], today: k.today, limit: k.limit, hour: k.hour, lamp: k.lamp, mode: k.mode}], {width: 440, empty: 0});
  return `<div class="iso keys-iso pult-iso" data-theme="light" data-overlay aria-hidden="true">${sh.svg}</div>`; }
function renderShelf() { if (!desk()) { const y = scrollY; render(); scrollTo(0, y); return; } renderRack(); const k = keyById(S.sel); const iso = document.querySelector('.pult-iso'); if (k && iso) iso.outerHTML = isoOf(k); }
function render() {
  $('#top-slot').innerHTML = (S.issued ? issuedHTML() : '') + (S.newOpen ? newHTML() : '');
  renderRack();
  const k = keyById(S.sel);
  const html = k ? pultHTML(k).replace('<span class="nameplate">', isoOf(k) + '<span class="nameplate">') : '';
  if (desk()) { $('#desk-slot').innerHTML = html; } else { $('#desk-slot').innerHTML = ''; const slot = document.querySelector('.pult-slot'); if (slot) slot.innerHTML = html; }
}
render();
let lastDesk = desk();
addEventListener('resize', () => { if (desk() !== lastDesk) { lastDesk = desk(); render(); } });

const stampHit = el => { if (reduced || !el) return; el.animate(spring(30, .7, 420).map(x => ({transform: `scale(${(1.6 - .6 * x).toFixed(3)}) rotate(${(-14 + 6 * x).toFixed(2)}deg)`, opacity: Math.min(1, x * 2)})), {duration: 420}); };

/* interactions */
document.addEventListener('click', e => {
  const t = e.target.closest('button,a'); if (!t) return;
  if (t.dataset.unit || t.dataset.hit) { const id = t.dataset.unit || t.dataset.hit;
    if (id === 'new') { S.newOpen = true; S.issued = null; render(); const n = $('#nn'); if (n) { n.scrollIntoView({block: 'center'}); n.focus(); } return; }
    if (!desk() && S.sel === id) { S.sel = null; render(); return; }
    S.sel = id; S.cmd = false; S.confirm = null; render();
    const p = document.querySelector('.pult');
    if (p && !reduced) p.animate([{transform: 'perspective(900px) rotateX(-62deg) scale(.7)', opacity: 0, transformOrigin: '50% 0'}, {transform: 'none', opacity: 1, transformOrigin: '50% 0'}], {duration: 320, easing: IO});
    const n = document.querySelector('.needle'), k = keyById(S.sel);
    if (n && k && !reduced) { const a = ang(k.hour); n.animate(spring(24, .8, 480).map(x => ({transform: `rotate(${(A0 + (a - A0) * x).toFixed(2)}deg)`})), {duration: 480, delay: 200}); }
    if (!desk() && p) p.scrollIntoView({block: 'start', behavior: reduced ? 'auto' : 'smooth'});
    return; }
  if (t.dataset.mode !== undefined) { const k = keyById(S.sel), from = k.mode, to = +t.dataset.mode; if (from === to) return; k.mode = to;
    document.querySelectorAll('.modes button').forEach(b => b.setAttribute('aria-checked', +b.dataset.mode === to));
    document.querySelector('.mode-note').textContent = MODE_NOTE[to];
    const kn = document.querySelector('.knob'), fa = [-40, 0, 40][from], ta = [-40, 0, 40][to]; kn.style.transform = `rotate(${ta}deg)`;
    if (!reduced) kn.animate(spring(24, 1, 260).map(x => ({transform: `rotate(${(fa + (ta - fa) * x).toFixed(2)}deg)`})), {duration: 260});
    renderShelf(); return; }
  if (t.dataset.lim) { const k = keyById(S.sel), v = Math.max(10, Math.min(990, k.limit + +t.dataset.lim)); if (v === k.limit) return;
    const oldX = Math.min(k.today / k.limit, 1) * 324; k.limit = v; const newX = Math.min(k.today / k.limit, 1) * 324;
    rollTo($('#limdrum'), intDrum(v, 3)); $('#limlive').textContent = `лимит ${v} ₽ в день`;
    document.querySelector('.limit-note').textContent = `При ${v} ₽ за день ключ встанет до полуночи по Москве. Баланс не тронется.`;
    $('#ruler').innerHTML = rulerSVG(k); const np = document.querySelector('#ruler .ptr');
    if (!reduced) np.animate([{transform: `translateX(${oldX}px)`}, {transform: `translateX(${newX}px)`}], {duration: 220, easing: OUTC});
    document.querySelector('.big small').textContent = `из ${v} ₽ сегодня`; renderShelf(); return; }
  if (t.dataset.nlim) { newLim = Math.max(10, Math.min(990, newLim + +t.dataset.nlim)); rollTo($('#nlim'), intDrum(newLim, 3)); return; }
  if (t.dataset.prog) { newProg = t.dataset.prog; document.querySelectorAll('.chips button').forEach(b => b.setAttribute('aria-checked', b === t)); return; }
  if (t.id === 'newbtn') { S.newOpen = true; S.issued = null; render(); const n = $('#nn'); if (n) n.focus(); return; }
  if (t.id === 'issue') { const name = ($('#nn').value || '').trim() || 'новый'; const full = 'sk-prs-' + rnd(32);
    const k = {id: 'k' + Date.now(), name, prog: newProg, tail: full.slice(-4), today: 0, limit: newLim, req: 0, tok: 0, hour: 0, lamp: 'off', act: 'сегодня запросов не было', mode: 0};
    S.keys.push(k); S.sel = k.id; S.issued = {full, prog: newProg, name}; S.newOpen = false; S.cmd = false; render(); penWrite(); landCab(k.id); window.scrollTo({top: 0, behavior: reduced ? 'auto' : 'smooth'}); return; }
  if (t.dataset.cmd !== undefined) { S.cmd = !S.cmd; render(); return; }
  if (t.dataset.revoke !== undefined) { S.confirm = S.sel; render(); return; }
  if (t.dataset.revokeNo !== undefined) { S.confirm = null; render(); return; }
  if (t.dataset.revokeYes !== undefined) { revoke(S.sel); return; }
  if (t.dataset.copy) { const o = t.textContent;
    (navigator.clipboard ? navigator.clipboard.writeText(t.dataset.copy) : Promise.reject()).then(() => { t.textContent = 'Скопировано'; setTimeout(() => t.textContent = o, 2000); }, () => { t.textContent = 'Выделили, скопируйте вручную'; }); }
});

function penWrite() { const el = $('#fullkey'), stamp = $('#stamp'); if (!el || reduced) return; const full = el.textContent;
  stamp.style.opacity = 0; const per = Math.min(40, 900 / full.length); let i = 0; el.textContent = '';
  const iv = setInterval(() => { i++; el.textContent = full.slice(0, i); if (i >= full.length) { clearInterval(iv); setTimeout(() => { stamp.style.opacity = ''; stampHit(stamp); }, 120); } }, per); }

function landCab(id) { const g = document.querySelector(`.unit[data-id="${id}"]`); if (!g || reduced) return;
  g.animate([{transform: 'translateX(-60%)', opacity: 0}, {transform: 'translateX(10px)', opacity: 1}], {duration: 320, easing: 'cubic-bezier(.33,1,.68,1)'}); }
function revoke(id) { const k = keyById(id); S.confirm = null;
  const finish = () => { S.keys = S.keys.filter(x => x.id !== id); S.revoked.unshift(k); S.sel = S.keys[0] ? S.keys[0].id : null; render();
    const st = document.querySelector('.revoked .stamp-in'); if (st && !reduced) stampHit(st); };
  const g = document.querySelector(`.unit[data-id="${id}"]`);
  if (reduced || !g) return finish();
  g.animate([{transform: 'translateX(10px)', opacity: 1}, {transform: 'translateX(110%)', opacity: 0}], {duration: 360, easing: 'cubic-bezier(.5,0,.75,0)', fill: 'forwards'}).finished.then(finish); }

if (STATE === 'issued') penWrite();
</script>
</body>
</html>
